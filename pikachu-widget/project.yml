# Generate the Xcode project with: xcodegen generate
name: PikachuPet

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ko

settings:
  base:
    # ▼ 본인 것으로 바꾸세요 (Xcode › Settings › Accounts 에서 Team ID 확인)
    DEVELOPMENT_TEAM: ""
    BUNDLE_ID_PREFIX: com.example
    # ▲
    APP_GROUP_ID: group.$(BUNDLE_ID_PREFIX).pikachupet
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"

targets:
  PikachuPet:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).pikachupet
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 피카츄
        AppGroupID: $(APP_GROUP_ID)
        NSSupportsLiveActivities: true
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.pikachupet.refresh]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: App/PikachuPet.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    dependencies:
      - target: PikachuWidget

  PikachuWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).pikachupet.widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: 피카츄
        AppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/PikachuWidget.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
